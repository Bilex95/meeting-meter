<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>meeting-meter</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
<main>
  <h1>meeting-meter</h1>
  <p class="tagline">What is this meeting costing, right now?</p>

  <div class="controls">
    <label>People <input id="people" type="number" min="1" value="4" /></label>
    <label>Avg hourly rate <input id="rate" type="number" min="0" step="0.01" value="25" /></label>
  </div>

  <p class="cost-label" id="cost-label">Running cost</p>
  <output id="cost" aria-labelledby="cost-label">0.00</output>
  <p id="elapsed" aria-label="Elapsed time">00:00:00</p>

  <div class="buttons">
    <button id="toggle" type="button" aria-pressed="false">Start</button>
    <button id="reset" type="button" class="ghost">Reset</button>
  </div>
</main>
<script src="app.js"></script>
</body>
</html>
